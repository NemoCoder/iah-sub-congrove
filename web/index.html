<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- favicon = congrove 自有 logo(三溪汇入树丛,青绿渐变)。⚠ 与 src/logo.tsx 是同一 SVG,改要两处同步。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%230d9488'/%3E%3Cstop offset='1' stop-color='%2316a34a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M12 54 C 22 52 27 46 30 39 M52 54 C 42 52 37 46 34 39 M32 55 L32 34' fill='none' stroke='%23fff' stroke-width='4.5' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='23' r='8.5' fill='%23fff'/%3E%3Ccircle cx='43' cy='23' r='8.5' fill='%23fff'/%3E%3Ccircle cx='32' cy='15.5' r='9.5' fill='%23fff'/%3E%3Ccircle cx='32' cy='21' r='4.5' fill='%2315803d'/%3E%3C/svg%3E"
    />
    <title>Congrove·汇流</title>
    <!-- ★整站唯一的全局样式:把 body 的默认外边距清零★（2026-08-09 用户：「我的内容没有超出屏幕范围
         为啥右边有个滚动条？」）。
         根因是**全仓库从来没有过任何 CSS reset**:antd v5+ 走 CSS-in-JS,`<App>` 只重置它自己
         那棵子树的字体/行高,**碰不到 body**;而浏览器给 body 的默认 `margin: 8px` 一直在。
         于是文档高 = 8 + `min-height:100vh` 的那层 + 8 = ★100vh + 16px★ ——
         ★内容再短也必然出现滚动条★,和页面上有多少东西完全无关。
         (antd 6 的 dist 里也不再单独提供 reset.css,所以这一条得我们自己写。) -->
    <style>
      html, body { margin: 0; padding: 0; }

      /* ★markdown 渲染的样式★（2026-08-13）。
         ⚠ `.cg-md` 这个类名在 preview.tsx 里挂了很久,**却从来没有被定义过** ——
           于是 react-markdown 吐出来的 <table> 是一张**没有任何边框**的表:
           内容都在,却塌成几行松散文字,看起来像「表格没渲染出来」。
           (是拿 qwen3.8-max 看 md 预览截图时发现的:它说「表格未以带格线的表格形式呈现」。)
         ★这不是预览功能的问题,是全站的★:站内文档、活动纪要用的是同一个 MarkdownView。
         放在这里而不是新起 css 文件:全仓库只有这一处全局样式(见上面 body reset 那条注释),
         再开一个文件就多一处要记得同步的地方。 */
      .cg-md table { border-collapse: collapse; margin: 10px 0; max-width: 100%; }
      .cg-md th, .cg-md td { border: 1px solid #e8e8e8; padding: 6px 10px; text-align: left; }
      .cg-md th { background: #fafafa; font-weight: 600; }
      .cg-md blockquote { margin: 10px 0; padding: 2px 12px; border-left: 3px solid #d9d9d9; color: #595959; }
      .cg-md code { background: #f5f5f5; border-radius: 3px; padding: 1px 5px; font-size: .92em; }
      .cg-md pre { background: #f5f5f5; border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
      .cg-md pre code { background: none; padding: 0; }
      .cg-md img { max-width: 100%; }
      .cg-md h1, .cg-md h2, .cg-md h3 { margin: 18px 0 8px; line-height: 1.4; }
      .cg-md h1 { font-size: 22px; } .cg-md h2 { font-size: 18px; } .cg-md h3 { font-size: 16px; }
      .cg-md > :first-child { margin-top: 0; }
      /* 长链接/长路径不撑破容器 —— 纪要里贴会议链接是常事 */
      .cg-md a { word-break: break-all; }

      /* ★列表:项目符号与文字要对齐★（2026-08-22 liaoruili 指出「项目符号贴最左、文字居中」）。
         ⚠ 根因和上面那张没边框的表是**同一个**:`.cg-md` 里从来没写过 ul/ol/li,
           而 antd 的全局 reset 会把 `ul,ol` 的 `padding`/`margin`/`list-style` 清零 ——
           于是 marker 无处可放,贴到容器最左边,文字反而缩在里面。
           ★不是「markdown 没渲染」,是渲染出来的东西没人给它样式。★
         这里显式写死,不依赖任何 reset 的行为(它随 antd 版本变)。 */
      .cg-md ul, .cg-md ol { margin: 8px 0; padding-left: 24px; list-style-position: outside; }
      .cg-md ul { list-style-type: disc; }
      .cg-md ol { list-style-type: decimal; }
      .cg-md li { margin: 2px 0; }
      /* 嵌套一层换个符号,不然两层看起来一样深 */
      .cg-md ul ul { list-style-type: circle; margin: 2px 0; }
      /* ★松散列表★:项与项之间空一行时,react-markdown 会把每项包成 <p>,
         而 <p> 的默认上下 margin 会让行距突然拉大一截 —— 同一份纪要,
         中间多打一个回车,整个列表的疏密就变了。 */
      .cg-md li > p { margin: 0; }
      .cg-md li > p + p { margin-top: 6px; }
      /* 任务列表(GFM `- [ ]`)的勾选框别顶到文字上 */
      .cg-md li input[type="checkbox"] { margin-right: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
